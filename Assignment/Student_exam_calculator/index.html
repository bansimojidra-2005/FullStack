<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Student Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }
    
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #eef3f7;
        }
    
        .card {
            width: 680px;
            max-width: 100%;
            padding: 38px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #dce4ea;
            box-shadow: 0 15px 40px rgba(18, 38, 63, 0.12);
        }
    
        h1 {
            text-align: center;
            color: #17324d;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 6px;
        }
    
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 15px;
            margin-bottom: 30px;
        }
    
        h3 {
            color: #24445f;
            font-size: 18px;
            margin: 25px 0 14px;
            padding-left: 10px;
            border-left: 4px solid #159a9c;
        }
    
        .student-info {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 14px;
        }
    
        .subjects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
    
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5df;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            color: #263746;
            background: #f8fafc;
            transition: 0.25s ease;
        }
    
        input::placeholder {
            color: #9aa8b5;
        }
    
        input:focus {
            border-color: #159a9c;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(21, 154, 156, 0.12);
        }
    
        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            border: none;
            border-radius: 8px;
            background: #17324d;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.25s ease;
        }
    
        button:hover {
            background: #159a9c;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(21, 154, 156, 0.22);
        }
    
        .result-card {
            margin-top: 30px;
            padding: 24px;
            border-radius: 12px;
            background: #f5f9fb;
            border: 1px solid #d9e5eb;
        }
    
        .result-card h2 {
            text-align: center;
            color: #17324d;
            font-size: 22px;
            margin-bottom: 18px;
        }
    
        .result-card p {
            width: 100%;
            margin: 9px 0;
            padding: 12px 14px;
            border-radius: 7px;
            background: #ffffff;
            border-left: 4px solid #159a9c;
            color: #405568;
            text-align: left;
            font-weight: 600;
            box-shadow: 0 2px 7px rgba(18, 38, 63, 0.05);
        }
    
        @media (max-width: 600px) {
    
            body {
                padding: 20px 12px;
            }
    
            .card {
                padding: 26px 18px;
            }
    
            .student-info {
                grid-template-columns: 1fr;
            }
    
            .subjects {
                grid-template-columns: 1fr;
            }
    
            h1 {
                font-size: 25px;
            }
    
            .result-card {
                padding: 18px;
            }
        }
    </style>    
</head>
<body>
<div class="card">

    <h1>🎓 Student Calculator</h1>
    <p class="subtitle">Enter student details & calculate result</p>

    <div class="student-info">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="roll" placeholder="Roll Number">
        <input type="text" id="class" placeholder="Class">
    </div>

    <h3>📚 Subject Marks</h3>

    <div class="subjects">
        <input type="text" id="num1" placeholder="Subject 1">
        <input type="text" id="num2" placeholder="Subject 2">
        <input type="text" id="num3" placeholder="Subject 3">
    </div>

    <button onclick="calculate()">Calculate Result</button>

    <div class="result-card">
        <h2>📊 Result</h2>

        <p id="total"></p>
        <p id="percentage"></p>
        <p id="grade"></p>
        <p id="result"></p>
    </div>

</div>
    <script src="script.js"></script>
</body>

</html>
